# cronwatcher example configuration
# Copy to config.yaml and adjust as needed.

store_path: /var/lib/cronwatcher/jobs.json
log_level: INFO
check_interval: 60

alert:
  smtp_host: smtp.example.com
  smtp_port: 587
  smtp_user: alerts@example.com
  smtp_password: secret
  from_addr: alerts@example.com
  to_addrs:
    - ops@example.com
  use_tls: true

jobs:
  - name: backup-db
    command: /usr/local/bin/backup_db.sh
    schedule: "0 2 * * *"
    timeout: 300
    retries: 2
    alert_after: 1
    tags:
      - backup
      - database

  - name: send-report
    command: python /opt/reports/send.py
    schedule: "0 8 * * 1"
    timeout: 120
    retries: 0
    alert_after: 1
    tags:
      - reports
      - weekly

  - name: cleanup-tmp
    command: find /tmp -mtime +7 -delete
    schedule: "30 3 * * *"
    timeout: 60
    tags:
      - maintenance
