# cronwatcher configuration file
# Copy this file to /etc/cronwatcher/config.yaml and adjust as needed.

log_level: INFO
log_file: /var/log/cronwatcher.log
state_dir: /var/lib/cronwatcher

alerts:
  email: ops@example.com
  webhook_url: https://hooks.example.com/alert
  slack_channel: "#ops-alerts"

jobs:
  - name: daily_backup
    schedule: "0 2 * * *"
    timeout: 3600
    alert_on_failure: true
    alert_on_timeout: true
    notify:
      - email
      - slack

  - name: hourly_sync
    schedule: "0 * * * *"
    timeout: 120
    alert_on_failure: true
    alert_on_timeout: false
    notify:
      - webhook

  - name: weekly_report
    schedule: "0 8 * * 1"
    timeout: 600
    alert_on_failure: true
    alert_on_timeout: true
    notify:
      - email
