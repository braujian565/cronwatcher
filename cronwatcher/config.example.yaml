# cronwatcher example configuration

store_path: /var/lib/cronwatcher/jobs.json
check_interval: 60

# Default channels used when a job does not specify notify_channels.
# Available built-in channels: log, email
default_notify_channels:
  - log
  - email

alert:
  smtp_host: smtp.example.com
  smtp_port: 587
  smtp_user: alerts@example.com
  smtp_password: "s3cr3t"
  from_address: alerts@example.com
  to_addresses:
    - ops@example.com

jobs:
  - name: daily-backup
    command: /usr/local/bin/backup.sh
    schedule: "0 2 * * *"
    timeout: 300
    alert_on_failure: true
    notify_channels:
      - email
      - log

  - name: health-check
    command: curl -sf https://example.com/health
    schedule: "*/5 * * * *"
    timeout: 10
    alert_on_failure: true
    # Uses default_notify_channels when omitted

  - name: cleanup-tmp
    command: find /tmp -mtime +7 -delete
    schedule: "30 3 * * 0"
    timeout: 120
    alert_on_failure: false
